<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayVault - Unblocked Games</title>
<link id="cloakFavicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%237c6cf0'/><path d='M30 65 L30 45 Q30 35 40 35 L42 35 L42 42 L40 42 Q38 42 38 45 L38 65 Z M62 65 L62 45 Q62 35 72 35 L74 35 L74 42 L72 42 Q70 42 70 45 L70 65 Z' fill='white'/><circle cx='42' cy='55' r='5' fill='white'/><circle cx='66' cy='55' r='5' fill='white'/><rect x='42' y='62' width='24' height='6' rx='3' fill='white'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a16;--bg2:#111128;--bg3:#1a1a35;
  --card:#14142c;--card-hover:#1c1c3e;--border:rgba(255,255,255,.06);
  --text:#e8e8f8;--text2:#9a9ac0;--text3:#55557a;
  --accent:#7c6cf0;--accent2:#a89eff;--accent-glow:rgba(124,108,240,.3);
  --hot:#ff5c5c;
  --glass-bg:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);
  --glass-blur:20px;--glass-shine:rgba(255,255,255,.05);
  --radius:14px;--radius-sm:10px;
  --card-size:150px;--grid-gap:14px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;height:100vh;
}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14)}

.glass-nav{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:4px;
  padding:5px 6px;
  background:rgba(14,14,30,.7);
  border:1px solid var(--glass-border);
  border-radius:50px;
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 var(--glass-shine);
}
.nav-btn{
  display:flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:40px;
  background:transparent;border:none;
  color:var(--text2);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s ease;
  position:relative;white-space:nowrap;
}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.nav-btn.active{color:#fff;background:var(--accent);box-shadow:0 2px 12px var(--accent-glow)}
.nav-btn svg{width:16px;height:16px;flex-shrink:0}
.nav-btn span{display:none}
.nav-divider{width:1px;height:20px;background:rgba(255,255,255,.08);margin:0 2px;flex-shrink:0}
.nav-logo{position:fixed;top:18px;left:20px;z-index:101;display:flex;align-items:center;gap:7px}
.nav-logo svg{width:24px;height:24px}
.nav-logo span{font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px}

.search-wrap{
  display:flex;align-items:center;overflow:hidden;
  transition:width .3s ease;width:38px;border-radius:40px;
}
.search-wrap.expanded{width:240px}
.search-wrap input{
  width:0;border:none;background:transparent;color:var(--text);
  font-size:13px;outline:none;padding:0;
  transition:width .3s ease,padding .3s ease;
}
.search-wrap.expanded input{width:200px;padding:0 8px}
.search-wrap input::placeholder{color:var(--text3)}

/* ===== MAIN CONTENT ===== */
.main{
  height:100vh;overflow-y:auto;
  padding:72px 28px 28px;
  scroll-behavior:smooth;
}
.section-header{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.section-header h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.section-header .badge{
  background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;
}
.section-header .badge.hot{background:var(--hot)}
.section-header .see-all{
  margin-left:auto;color:var(--accent2);font-size:13px;cursor:pointer;
  text-decoration:none;transition:color .2s;font-weight:500;
}
.section-header .see-all:hover{color:var(--text)}

.game-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--card-size),1fr));
  gap:var(--grid-gap);margin-bottom:32px;
}
.game-card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;position:relative;
  border:1px solid var(--border);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  will-change:transform;
}
.game-card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  border-color:rgba(255,255,255,.1);
}
.game-card .thumb{
  width:100%;aspect-ratio:1;object-fit:cover;display:block;
  background:var(--bg3);
}
.game-card .card-info{padding:8px 10px}
.game-card .card-name{
  font-size:12px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.game-card .hot-badge{
  position:absolute;top:6px;right:6px;background:var(--hot);
  color:#fff;font-size:8px;font-weight:700;padding:2px 6px;
  border-radius:4px;text-transform:uppercase;letter-spacing:.5px;
}
.game-card .play-overlay{
  position:absolute;inset:0;
  background:rgba(124,108,240,.65);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .18s;pointer-events:none;
}
.game-card:hover .play-overlay{opacity:1}
.play-overlay span{font-size:40px;color:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}

.reduced-motion .game-card{transition:none!important}
.reduced-motion .game-card:hover{transform:none!important}
.reduced-motion .game-card .play-overlay{transition:none!important}
.reduced-motion *{animation:none!important;transition-duration:0s!important}

.az-bar{
  display:flex;flex-wrap:wrap;gap:3px;margin-bottom:20px;
  padding:10px 0;border-top:1px solid var(--border);
}
.az-bar a{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-size:11px;font-weight:600;color:var(--text3);
  text-decoration:none;transition:all .15s;cursor:pointer;
}
.az-bar a:hover{background:var(--accent);color:#fff}
.az-bar a.disabled{opacity:.2;pointer-events:none}

.letter-section{margin-bottom:24px;content-visibility:auto;contain-intrinsic-size:auto 300px;scroll-margin-top:84px}
.sort-toggle{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--glass-border)}
.sort-btn{background:none;border:none;color:var(--text2);font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s}
.sort-btn:hover{color:var(--text)}
.sort-btn.active{background:var(--accent);color:#fff}
.letter-section h3{
  font-size:15px;font-weight:700;color:var(--accent2);
  margin-bottom:12px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(5,5,14,.9);z-index:300;
  display:none;align-items:center;justify-content:center;
  will-change:opacity;
}
.modal-overlay.active{display:flex}
body.modal-open .animated-bg .orb{animation-play-state:paused!important}
.modal{
  position:relative;
  width:96vw;height:94vh;background:var(--bg2);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 16px 40px rgba(0,0,0,.55);
  border:1px solid var(--glass-border);
  contain:layout paint;will-change:transform,opacity;
}
.modal-header{
  display:flex;align-items:center;padding:10px 14px;
  background:#0e0e1e;
  border-bottom:1px solid var(--border);
  gap:10px;flex-shrink:0;
}
.modal-header img{width:26px;height:26px;border-radius:7px}
.modal-header .modal-title{font-size:14px;font-weight:600;flex:1}
.mbtn{
  background:rgba(255,255,255,.06);border:1px solid var(--glass-border);
  border-radius:8px;color:var(--text2);padding:6px 12px;cursor:pointer;
  font-size:12px;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;gap:4px;
}
.mbtn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.mbtn.close:hover{background:var(--hot);border-color:var(--hot);color:#fff}
.modal iframe{flex:1;border:none;width:100%;background:#000;transition:opacity .22s ease;will-change:opacity}
.modal-body{position:relative;flex:1;display:flex;min-height:0;background:var(--bg2);contain:strict}

/* Game launch splash */
.game-splash{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at 50% 45%,rgba(124,108,240,.14),transparent 60%),var(--bg2);
  will-change:transform,opacity;
}
.game-splash.hidden{display:none}
.splash-icon-wrap{position:relative;width:88px;height:88px;margin-bottom:8px;will-change:transform,opacity}
.splash-icon-wrap::before{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  border:2px solid rgba(124,108,240,.18);
  border-top-color:var(--accent);border-right-color:var(--accent2);
  animation:splashSpin .9s linear infinite;will-change:transform;
}
.splash-icon{
  width:100%;height:100%;border-radius:20px;object-fit:cover;display:block;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.splash-title{font-size:19px;font-weight:700;letter-spacing:.2px;color:var(--text);text-align:center;padding:0 20px}
.splash-sub{font-size:11px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--text2)}
@keyframes splashSpin{to{transform:rotate(360deg)}}

/* Home clock */
.home-hero{text-align:center;padding:7.5vh 0 7.5vh}
.home-time{
  font-size:clamp(64px,13vw,150px);font-weight:800;line-height:1;letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--text) 30%,var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;transform:translateX(14px);
}
.home-ampm{font-size:.28em;font-weight:700;letter-spacing:1px;margin-left:.25em;vertical-align:.95em;color:var(--accent2);-webkit-text-fill-color:var(--accent2)}
.home-date{margin-top:14px;font-size:clamp(15px,2vw,20px);font-weight:500;color:var(--text2);letter-spacing:.3px}
.game-grid.home-picks{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:700px){.game-grid.home-picks{grid-template-columns:repeat(3,minmax(0,1fr))}}

.explore-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.explore-tag{
  padding:7px 16px;border-radius:40px;
  background:rgba(255,255,255,.03);border:1px solid var(--glass-border);
  color:var(--text2);font-size:12px;cursor:pointer;
  transition:all .18s;font-weight:500;
}
.explore-tag:hover,.explore-tag.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 2px 10px var(--accent-glow);
}

.recent-bar{
  display:flex;gap:10px;margin-bottom:28px;
  overflow-x:auto;padding-bottom:8px;
}
.recent-bar::-webkit-scrollbar{height:3px}
.recent-item{flex-shrink:0;width:80px;cursor:pointer;text-align:center}
.recent-item img{
  width:80px;height:80px;border-radius:var(--radius-sm);object-fit:cover;
  border:2px solid transparent;transition:border-color .2s;background:var(--bg3);
}
.recent-item:hover img{border-color:var(--accent)}
.recent-item .rname{
  font-size:10px;color:var(--text2);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.no-results{text-align:center;padding:80px 20px;color:var(--text3)}
.no-results .big{font-size:48px;margin-bottom:12px}
.no-results p{font-size:14px}

.footer{
  text-align:center;padding:24px;color:var(--text3);font-size:11px;
  border-top:1px solid var(--border);margin-top:16px;
}

.beta-banner{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;margin-bottom:20px;
  background:rgba(253,203,110,.08);border:1px solid rgba(253,203,110,.2);
  border-radius:var(--radius);font-size:13px;color:var(--text2);
}
.beta-banner .beta-tag{
  background:#fdcb6e;color:#1a1a35;font-size:10px;font-weight:800;
  padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;
  flex-shrink:0;
}
.beta-banner .dismiss{
  margin-left:auto;background:none;border:none;color:var(--text3);
  font-size:16px;cursor:pointer;padding:0 4px;
}
.beta-banner .dismiss:hover{color:var(--text)}

/* ===== REPORT SYSTEM ===== */
.report-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.report-overlay.active{display:flex}
.report-box{
  background:var(--bg2);border:1px solid var(--glass-border);border-radius:var(--radius);
  padding:24px;width:min(420px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.report-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;font-size:16px;font-weight:700;
}
.report-header .dismiss{
  background:none;border:none;color:var(--text3);font-size:20px;
  cursor:pointer;padding:0 4px;
}
.report-header .dismiss:hover{color:var(--text)}
.report-game-name{
  font-size:13px;color:var(--accent2);margin-bottom:14px;
  padding:8px 12px;background:rgba(255,255,255,.03);border-radius:8px;
}
.report-reasons{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.report-reason{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);
  cursor:pointer;padding:6px 10px;border-radius:8px;transition:background .15s;
}
.report-reason:hover{background:rgba(255,255,255,.04)}
.report-reason input{accent-color:var(--accent)}
.report-comment{
  width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);
  border-radius:8px;padding:10px;color:var(--text);font-size:13px;
  font-family:inherit;resize:vertical;outline:none;margin-bottom:14px;
}
.report-comment:focus{border-color:var(--accent)}
.report-actions{display:flex;gap:8px;justify-content:flex-end}
.report-success{
  text-align:center;padding:20px;color:var(--accent2);font-size:14px;
}

/* Report inbox */
.inbox-empty{text-align:center;padding:30px;color:var(--text3);font-size:13px}
.inbox-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  border-bottom:1px solid var(--border);transition:background .15s;
}
.inbox-item:last-child{border-bottom:none}
.inbox-item:hover{background:rgba(255,255,255,.02)}
.inbox-badge{
  flex-shrink:0;padding:3px 8px;border-radius:6px;font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:.5px;
}
.inbox-badge.not_working{background:rgba(255,165,0,.15);color:#ffa500}
.inbox-badge.broken{background:rgba(255,80,80,.15);color:var(--hot)}
.inbox-badge.offensive{background:rgba(255,0,80,.15);color:#ff0050}
.inbox-badge.other{background:rgba(255,255,255,.08);color:var(--text2)}
.inbox-info{flex:1;min-width:0}
.inbox-name{font-size:13px;font-weight:600;color:var(--text)}
.inbox-comment{font-size:11px;color:var(--text3);margin-top:3px;word-break:break-word}
.inbox-time{font-size:10px;color:var(--text3);margin-top:4px}
.inbox-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.inbox-actions button{
  padding:4px 10px;border-radius:6px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);color:var(--text3);font-size:11px;
  cursor:pointer;transition:all .15s;
}
.inbox-actions button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.inbox-actions button.del:hover{background:rgba(255,80,80,.15);color:var(--hot)}
.inbox-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;border-radius:9px;
  background:var(--hot);color:#fff;font-size:10px;font-weight:700;
  padding:0 5px;margin-left:6px;
}

/* ===== SETTINGS PAGE ===== */
.settings-page{max-width:680px;margin:0 auto}
.settings-page h2{font-size:22px;font-weight:700;margin-bottom:24px}
.s-section{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;
}
.s-section h3{
  font-size:13px;color:var(--accent2);text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:16px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.s-section h3 svg{width:16px;height:16px}
.s-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border);
  gap:16px;
}
.s-row:last-child{border-bottom:none}
.s-row .s-label{flex:1}
.s-row .s-label .title{font-size:13px;font-weight:500;color:var(--text)}
.s-row .s-label .desc{font-size:11px;color:var(--text3);margin-top:2px}
.s-row select,.s-row input[type=text],.s-row input[type=number]{
  background:rgba(255,255,255,.04);border:1px solid var(--glass-border);
  border-radius:8px;padding:7px 10px;color:var(--text);font-size:12px;
  outline:none;min-width:140px;transition:border-color .2s;
}
.s-row select:focus,.s-row input:focus{border-color:var(--accent)}
.s-row select option{background:var(--bg2);color:var(--text)}
.s-row input[type=range]{
  width:140px;accent-color:var(--accent);height:20px;
}
.s-row .val{font-size:11px;color:var(--text3);min-width:36px;text-align:right}
.toggle{
  width:42px;height:24px;border-radius:12px;
  background:rgba(255,255,255,.1);border:none;cursor:pointer;
  position:relative;transition:background .2s;flex-shrink:0;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .2s;
}
.toggle.on::after{transform:translateX(18px)}
.s-colors{display:flex;gap:6px;flex-wrap:wrap}
.s-color{
  width:28px;height:28px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:all .15s;
}
.s-color:hover{transform:scale(1.15)}
.s-color.active{border-color:#fff;box-shadow:0 0 10px var(--accent-glow)}
.s-btn{
  padding:8px 16px;border-radius:8px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);color:var(--text2);font-size:12px;
  cursor:pointer;transition:all .2s;
}
.s-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
.s-btn.danger{border-color:rgba(255,80,80,.3)}
.s-btn.danger:hover{background:rgba(255,80,80,.15);color:var(--hot);border-color:var(--hot)}
.s-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.s-btn.primary:hover{opacity:.85}
.cloak-presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cloak-preset{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.03);border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);cursor:pointer;transition:all .18s;
}
.cloak-preset:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.cloak-preset.active{border-color:var(--accent);background:rgba(124,108,240,.08)}
.cloak-preset .cp-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.cloak-preset .cp-name{font-size:12px;font-weight:500;color:var(--text)}
.cloak-preset .cp-desc{font-size:10px;color:var(--text3)}
.panic-key-display{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.06);border:1px solid var(--glass-border);
  border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text);
  font-family:monospace;
}
.s-row .key-capture{
  padding:7px 14px;border-radius:8px;
  background:rgba(255,255,255,.04);border:1px dashed var(--glass-border);
  color:var(--text2);font-size:12px;cursor:pointer;
  transition:all .2s;min-width:120px;text-align:center;
}
.s-row .key-capture:hover,.s-row .key-capture.listening{
  border-color:var(--accent);color:var(--accent);
}
.about-blank-notice{
  margin-top:8px;padding:10px 12px;
  background:rgba(124,108,240,.06);border:1px solid rgba(124,108,240,.15);
  border-radius:8px;font-size:11px;color:var(--text2);line-height:1.5;
}

/* ===== TOOLS PAGE ===== */
.tools-page{max-width:1020px;margin:0 auto;padding-top:10px}
.tools-page h2{font-size:28px;font-weight:800;margin-bottom:24px;letter-spacing:-.5px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px;margin-bottom:32px}
.tool-card{
  background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);
  padding:36px 34px;cursor:pointer;transition:transform .22s cubic-bezier(.22,1,.36,1),border-color .22s,box-shadow .22s,background .22s;
  display:flex;align-items:center;gap:26px;min-height:168px;position:relative;overflow:hidden;
}
.tool-card:hover{
  background:var(--card-hover);border-color:var(--accent);
  transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 28px var(--accent-glow);
}
.tool-card .tool-icon{
  flex-shrink:0;width:84px;height:84px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:22px;
}
.tool-card .tool-icon svg{width:50px;height:50px}
.tool-emoji svg{width:28px;height:28px;vertical-align:middle}
.tool-card .tool-tag{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;background:rgba(124,108,240,.16);color:var(--accent2);margin-bottom:8px;
}
.tool-card .tool-name{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.4px}
.tool-card .tool-desc{font-size:14px;color:var(--text2);margin-top:6px;line-height:1.45}
.tool-panel{
  background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);
  padding:32px;margin-bottom:20px;
}
.tool-panel-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.tool-panel-header .back-btn{
  background:rgba(255,255,255,.06);border:1px solid var(--glass-border);
  border-radius:10px;color:var(--text2);padding:10px 16px;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px;
}
.tool-panel-header .back-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.tool-panel-header h3{font-size:22px;font-weight:800;flex:1}
.tool-panel-header .tool-emoji{font-size:26px}

/* Fullscreen uOS Overlay */
.uos-overlay{
  position:fixed;inset:0;width:100vw;height:100vh;z-index:500;
  background:#05070c;display:none;
}
.uos-overlay.active{display:block}
.uos-overlay iframe{width:100%;height:100%;border:none;display:block}
.uos-exit{
  position:fixed;top:10px;right:12px;z-index:510;
  padding:6px 14px;border-radius:99px;
  background:rgba(15,18,28,.65);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:rgba(255,255,255,.7);font-size:12px;font-weight:600;cursor:pointer;
  opacity:.45;transition:opacity .2s,background .2s,color .2s,transform .2s;
}
.uos-exit:hover{opacity:1;background:rgba(255,80,80,.85);border-color:rgba(255,80,80,1);color:#fff;transform:scale(1.04)}

/* Emulator Dropzone & Player */
.emu-dropzone{
  border:2px dashed rgba(124,108,240,.45);border-radius:var(--radius);
  background:rgba(124,108,240,.06);padding:42px 24px;text-align:center;
  transition:all .2s;cursor:pointer;margin-bottom:18px;
}
.emu-dropzone:hover,.emu-dropzone.dragover{background:rgba(124,108,240,.14);border-color:var(--accent);transform:scale(1.01)}
.emu-cores{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.emu-core-pill{
  padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--text2);
}
.emu-stage{
  width:100%;height:560px;background:#000;border-radius:var(--radius-sm);
  border:1px solid var(--border);overflow:hidden;display:none;position:relative;margin-top:16px;
}
.emu-stage.active{display:block}
.emu-stage iframe{width:100%;height:100%;border:none}

/* Save Manager */
.save-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.save-stat-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
.save-stat-box .ss-val{font-size:24px;font-weight:800;color:var(--accent2)}
.save-stat-box .ss-lbl{font-size:12px;color:var(--text3);margin-top:2px}
.save-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin-top:14px}
.save-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;
}
.save-item .si-key{font-family:monospace;font-size:13px;font-weight:700;color:var(--text);word-break:break-all}
.save-item .si-meta{font-size:11px;color:var(--text3);margin-top:3px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-item .si-actions{display:flex;gap:6px;flex-shrink:0}

/* Soundboard */
.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:16px}
.sb-pad{
  padding:18px 14px;border-radius:14px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);color:var(--text);text-align:center;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;
  display:flex;flex-direction:column;align-items:center;gap:8px;user-select:none;
}
.sb-pad:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.sb-pad:active,.sb-pad.playing{
  transform:scale(.95);border-color:var(--accent);
  background:rgba(124,108,240,.22);box-shadow:0 0 22px var(--accent-glow);
}
.sb-pad .sb-emoji{font-size:28px;line-height:1}
.sb-pad .sb-name{font-size:13px;font-weight:700}

/* Fake Update Overlay */
.fake-update-overlay{
  position:fixed;inset:0;width:100vw;height:100vh;z-index:550;display:none;
  user-select:none;
}
.fake-update-overlay.active{display:flex}
@keyframes winSpin{to{transform:rotate(360deg)}}

/* Downloader list */
.dl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-height:500px;overflow-y:auto;padding-right:4px;margin-top:14px}
.dl-card{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;
}
.dl-card img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.dl-card .dl-info{flex:1;min-width:0}
.dl-card .dl-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-card .dl-cat{font-size:11px;color:var(--text3)}

/* Animated background */
.animated-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.animated-bg .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12;will-change:transform}
.animated-bg .orb:nth-child(1){width:400px;height:400px;background:#7c6cf0;top:-10%;left:-5%;animation:orbA 25s ease-in-out infinite}
.animated-bg .orb:nth-child(2){width:350px;height:350px;background:#e84393;bottom:-10%;right:-5%;animation:orbB 30s ease-in-out infinite}
.animated-bg .orb:nth-child(3){width:300px;height:300px;background:#00cec9;top:40%;left:50%;animation:orbC 22s ease-in-out infinite}
@keyframes orbA{0%,100%{transform:translate(0,0)}33%{transform:translate(60px,80px)}66%{transform:translate(-40px,30px)}}
@keyframes orbB{0%,100%{transform:translate(0,0)}33%{transform:translate(-70px,-60px)}66%{transform:translate(50px,-30px)}}
@keyframes orbC{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-80px,50px) scale(1.1)}66%{transform:translate(40px,-60px) scale(.9)}}
.reduced-motion .animated-bg .orb{animation:none!important}

/* Pointer cursor for clickable elements */
.game-card,.nav-btn,.s-btn,.tool-card,.explore-tag,.cloak-preset,.toggle,.flip-btn,.sw-btn,.calc-btn,.s-color,.recent-item,.fav-btn,.modal-fav,.mbtn,.theme-card,.bg-pill,.wiz-opt,.sb-pad{cursor:pointer}

/* Home greeting & 24h centering */
.home-time.no-ampm{transform:none}
.home-greeting{margin-top:10px;font-size:clamp(16px,2.2vw,22px);font-weight:600;color:var(--text);letter-spacing:-.2px}

/* Background style variants */
body.bg-grid .animated-bg .orb,body.bg-dots .animated-bg .orb,body.bg-none .animated-bg .orb{display:none}
body.bg-grid .animated-bg{
  background-image:
    linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 35%, #000 35%, transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 35%, #000 35%, transparent 85%);
}
body.bg-dots .animated-bg{
  background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px);
  background-size:24px 24px;
}

/* Nav labels & card title options */
body.show-nav-labels .nav-btn span{display:inline}
body.hide-card-titles .game-card .card-info{opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
body.hide-card-titles .game-card:hover .card-info{opacity:1;transform:translateY(0)}

/* Settings theme & personalization controls */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin-top:10px}
.theme-card{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.03);border:1px solid var(--glass-border);transition:all .18s;
}
.theme-card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.theme-card.active{border-color:var(--accent);background:rgba(124,108,240,.12);box-shadow:0 0 14px var(--accent-glow)}
.theme-swatch{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.18);flex-shrink:0;position:relative;overflow:hidden}
.theme-swatch::after{content:'';position:absolute;inset:auto 0 0 0;height:40%;background:var(--accent)}
.theme-meta .t-name{font-size:12px;font-weight:600;color:var(--text)}
.theme-meta .t-desc{font-size:10px;color:var(--text3)}

.bg-pills{display:flex;gap:6px;flex-wrap:wrap}
.bg-pill{
  padding:6px 13px;border-radius:30px;font-size:12px;font-weight:500;
  background:rgba(255,255,255,.04);border:1px solid var(--glass-border);color:var(--text2);transition:all .18s;
}
.bg-pill:hover{color:var(--text);background:rgba(255,255,255,.08)}
.bg-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px var(--accent-glow)}

.color-picker-wrap{
  position:relative;width:28px;height:28px;border-radius:50%;overflow:hidden;
  border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s,border-color .15s;
}
.color-picker-wrap:hover{transform:scale(1.12);border-color:#fff}
.color-picker-wrap input[type=color]{position:absolute;inset:-8px;width:44px;height:44px;opacity:0;cursor:pointer;border:none}

.setup-banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 20px;margin-bottom:16px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(124,108,240,.18),rgba(232,67,147,.1));
  border:1px solid rgba(124,108,240,.35);
}
.setup-banner .sb-text h4{font-size:14px;font-weight:700;margin-bottom:3px;color:var(--text)}
.setup-banner .sb-text p{font-size:12px;color:var(--text2)}

/* First-Time Setup Wizard */
.setup-overlay{
  position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.78);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.setup-overlay.active{display:flex}
.setup-card{
  width:100%;max-width:560px;background:var(--bg2);
  border:1px solid var(--glass-border);border-radius:20px;
  box-shadow:0 24px 80px rgba(0,0,0,.65),0 0 40px var(--accent-glow);
  overflow:hidden;display:flex;flex-direction:column;max-height:90vh;
  animation:wizPop .28s cubic-bezier(.22,1,.36,1);
}
@keyframes wizPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.setup-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);
}
.setup-brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text)}
.setup-brand span.step-tag{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.06);color:var(--text2);
}
.setup-skip{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:color .15s}
.setup-skip:hover{color:var(--text)}
.setup-body{padding:24px;overflow-y:auto;flex:1}
.setup-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.setup-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.45}
.wiz-field{margin-bottom:18px}
.wiz-field:last-child{margin-bottom:0}
.wiz-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;display:block}
.wiz-input{
  width:100%;padding:11px 14px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border);
  color:var(--text);font-size:14px;outline:none;transition:border-color .18s;
}
.wiz-input:focus{border-color:var(--accent)}
.wiz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wiz-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.wiz-opt{
  padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);
  border:1px solid var(--glass-border);transition:all .18s;text-align:left;
  display:flex;align-items:center;gap:10px;
}
.wiz-opt:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.wiz-opt.active{border-color:var(--accent);background:rgba(124,108,240,.14);box-shadow:0 0 14px var(--accent-glow)}
.wiz-opt .wo-title{font-size:13px;font-weight:600;color:var(--text)}
.wiz-opt .wo-desc{font-size:11px;color:var(--text3);margin-top:2px}
.setup-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-top:1px solid var(--border);background:rgba(0,0,0,.2);
}
.setup-dots{display:flex;gap:6px}
.setup-dot{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.16);transition:all .2s}
.setup-dot.active{width:22px;background:var(--accent)}
.setup-dot.done{background:var(--accent2)}
.setup-actions{display:flex;gap:8px}

/* Favorites */
.fav-btn{position:absolute;top:6px;left:6px;z-index:2;background:rgba(0,0,0,.5);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s,transform .18s;backdrop-filter:blur(4px)}
.game-card:hover .fav-btn,.fav-btn.active{opacity:1}
.fav-btn:hover{transform:scale(1.15)}
.fav-btn svg{width:16px;height:16px}
.fav-btn.active svg{fill:#ff5c5c;stroke:#ff5c5c}
.modal-fav{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:8px;color:var(--text2);padding:6px 12px;font-size:12px;transition:all .2s;display:flex;align-items:center;gap:4px}
.modal-fav:hover{background:rgba(255,255,255,.1);color:var(--text)}
.modal-fav.active{color:#ff5c5c;border-color:rgba(255,80,80,.3)}
.modal-fav svg{width:14px;height:14px}
.modal-fav.active svg{fill:#ff5c5c;stroke:#ff5c5c}

@media(max-width:640px){
  .main{padding:68px 14px 14px}
  .game-grid{gap:8px}
  .nav-btn{padding:9px 12px}
  .nav-logo span{display:none}
  .nav-logo{left:10px;top:20px}
  .search-wrap.expanded{width:160px}
  .cloak-presets{grid-template-columns:1fr}
  .tools-grid{grid-template-columns:1fr}
  .sw-display{font-size:40px}
  .sw-ms{font-size:22px}
  .calc-btn{padding:10px}
  .wiz-grid,.wiz-grid.cols-3{grid-template-columns:1fr}
}
</style>
</head>

  </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

    <span>Tools</span>
  </button>

function lightenHex(hex, amt) {
  if (!hex || hex.toLowerCase() === '#7c6cf0') return '#a29bfe';
  const clean = hex.replace('#', '');
  if (clean.length !== 6) return hex;
  const num = parseInt(clean, 16);
  const r = Math.min(255, ((num >> 16) & 255) + amt);
  const g = Math.min(255, ((num >> 8) & 255) + amt);
  const b = Math.min(255, (num & 255) + amt);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

let recentlyPlayed = [];
try { recentlyPlayed = JSON.parse(localStorage.getItem('pv_recent') || '[]'); } catch(e) {}

let favorites = [];
try { favorites = JSON.parse(localStorage.getItem('pv_favorites') || '[]'); } catch(e) {}

function saveFavorites() {
  try { localStorage.setItem('pv_favorites', JSON.stringify(favorites)); } catch(e) {}
}

function isFavorite(name) {
  return favorites.includes(name);
}

function toggleFavorite(name) {
  if (isFavorite(name)) {
    favorites = favorites.filter(n => n !== name);
  } else {
    favorites.unshift(name);
  }
  saveFavorites();
  const modalTitle = document.getElementById('modalTitle');
  if (modalTitle && modalTitle.textContent === name) {
    const btn = document.getElementById('modalFav');
    const txt = document.getElementById('modalFavText');
    if (btn) btn.classList.toggle('active', isFavorite(name));
    if (txt) txt.textContent = isFavorite(name) ? 'Favorited' : 'Favorite';
  }
  document.querySelectorAll('.fav-btn').forEach(btn => {
    if (btn.dataset.game === name) btn.classList.toggle('active', isFavorite(name));
  });
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('pv_settings') || '{}');
    Object.assign(settings, s);
  } catch(e) {}
  applySettings();
}

function saveSettings() {
  try { localStorage.setItem('pv_settings', JSON.stringify(settings)); } catch(e) {}
}

function applySettings() {
  const r = document.documentElement;
  const t = THEMES.find(x => x.id === settings.theme) || THEMES[0];
  r.style.setProperty('--bg', t.bg);
  r.style.setProperty('--bg2', t.bg2);
  r.style.setProperty('--bg3', t.bg3);
  r.style.setProperty('--card', t.card);
  r.style.setProperty('--card-hover', t.cardHover);
  r.style.setProperty('--card-size', settings.cardSize + 'px');
  r.style.setProperty('--grid-gap', settings.gridGap + 'px');
  r.style.setProperty('--radius', (settings.cardRadius ?? 14) + 'px');
  r.style.setProperty('--accent', settings.accent);
  r.style.setProperty('--accent2', lightenHex(settings.accent, 42));
  r.style.setProperty('--accent-glow', settings.accent + '4d');
  document.body.classList.toggle('reduced-motion', !!settings.reducedMotion);
  document.body.classList.toggle('show-nav-labels', !!settings.navLabels);
  document.body.classList.toggle('hide-card-titles', settings.showCardTitles === false);
  ['orbs','grid','dots','none'].forEach(b => document.body.classList.toggle('bg-' + b, (settings.bgStyle || 'orbs') === b));
  applyCloak();
}

function applyCloak() {
  const preset = CLOAK_PRESETS.find(p => p.id === settings.cloak);
  if (!preset || preset.id === 'none') {
    document.title = ORIGINAL_TITLE;
    document.getElementById('cloakFavicon').href = ORIGINAL_FAVICON;
  } else if (preset.id === 'custom') {
    document.title = settings.cloakCustomTitle || ORIGINAL_TITLE;
    document.getElementById('cloakFavicon').href = settings.cloakCustomFavicon || ORIGINAL_FAVICON;
  } else {
    document.title = preset.title;
    document.getElementById('cloakFavicon').href = preset.favicon;
  }
}

function applySorting() {
  sortedGames = [...GAMES];
  if (settings.sort === 'az') sortedGames.sort((a, b) => a.name.localeCompare(b.name));
  else if (settings.sort === 'za') sortedGames.sort((a, b) => b.name.localeCompare(a.name));
  else sortedGames.sort(() => Math.random() - .5);
}

async function init() {
  const resp = await fetch('game-catalog.json');
  GAMES = await resp.json();
  GAMES.forEach(g => {
    g.category = categorize(g.name);
    g.isPopular = POPULAR_NAMES.has(g.name);
  });
  GAMES.sort((a, b) => a.name.localeCompare(b.name));
  loadSettings();
  applySorting();

  const urlParams = new URLSearchParams(window.location.search);
  const forceBlank = urlParams.get('blank') === '1';
  if ((forceBlank || settings.aboutBlank) && window === window.top && window.location.href.indexOf('about:blank') === -1) {
    if (!openInAboutBlank(true)) {
      const autoTrigger = () => {
        if (openInAboutBlank(true)) {
          window.removeEventListener('click', autoTrigger, true);
          window.removeEventListener('keydown', autoTrigger, true);
        }
      };
      window.addEventListener('click', autoTrigger, true);
      window.addEventListener('keydown', autoTrigger, true);
    }
  }

  renderView('home');
  setupEvents();
}

  if (view === 'explore') view = 'games';
  currentView = view;
  if (view !== 'tools') currentTool = null;
  if (homeClockTimer) { clearInterval(homeClockTimer); homeClockTimer = null; }
  const area = document.getElementById('contentArea');
  document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  document.getElementById('mainContent').scrollTop = 0;
  switch(view) {
    case 'home': renderHome(area); break;
    case 'games': renderGames(area); break;
    case 'favorites': renderFavorites(area); break;
    case 'search': renderSearch(area, extra); break;
    case 'tools': renderTools(area); break;
    case 'settings': renderSettings(area); break;
  }
}

function updateHomeClock() {
  const t = document.getElementById('homeTime');
  const d = document.getElementById('homeDate');
  if (!t || !d) return;
  const now = new Date();
  const opts = { hour: 'numeric', minute: '2-digit', hour12: !settings.clock24h };
  if (settings.clockSeconds) opts.second = '2-digit';
  const time = now.toLocaleTimeString([], opts);
  const m = time.match(/^(.*?)\s*([AaPp]\.?[Mm]\.?)$/);
  t.classList.toggle('no-ampm', !m);
  t.innerHTML = m ? `${m[1]}<span class="home-ampm">${m[2]}</span>` : time;
  d.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const g = document.getElementById('homeGreeting');
  if (g) {
    const name = (settings.userName || '').trim();
    if (settings.showGreeting || name) {
      const hr = now.getHours();
      const sal = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
      g.textContent = name ? `${sal}, ${name}` : sal;
      g.style.display = '';
    } else {
      g.style.display = 'none';
    }
  }
}

function renderHome(area) {
  let html = '';

  let betaDismissed = false;
  try { betaDismissed = localStorage.getItem('pv_beta_dismissed') === '1'; } catch(e) {}
  if (!betaDismissed) {
    html += `<div class="beta-banner" id="betaBanner">
      <span class="beta-tag">Beta</span>
      <span>Welcome to PlayVault! This site is in <strong>beta</strong> &mdash; expect bugs, broken games, and missing features.</span>
      <button class="dismiss" onclick="document.getElementById('betaBanner').remove();try{localStorage.setItem('pv_beta_dismissed','1')}catch(e){}" title="Dismiss">&times;</button>
    </div>`;
  }

  const count = settings.homeGamesCount || 5;
  const recent = settings.showRecent ? recentlyPlayed.map(n => GAMES.find(g => g.name === n)).filter(Boolean).slice(0, count) : [];
  const hasRecent = recent.length > 0;
  const picks = hasRecent ? recent : [...GAMES].sort(() => Math.random() - .5).slice(0, count);

  html += `

let gamesFilter = 'all';

function gamesOrder() { return settings.sort === 'za' ? 'za' : 'az'; }

function setGamesOrder(order) {
  settings.sort = order;
  applySorting();
  saveSettings();
  renderGamesList();
}

function filterExplore(el, filter) {
  gamesFilter = filter;
  document.querySelectorAll('.explore-tag').forEach(t => t.classList.toggle('active', t === el));
  renderGamesList();
}

function renderGamesList() {
  const wrap = document.getElementById('gamesList');
  if (!wrap) return;
  const order = gamesOrder();
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.order === order));

  let list;
  if (gamesFilter === 'all') list = GAMES;
  else if (gamesFilter === 'popular') list = GAMES.filter(g => g.isPopular);
  else if (gamesFilter === 'favorites') list = favorites.map(n => GAMES.find(g => g.name === n)).filter(Boolean);
  else if (gamesFilter === 'recent') list = recentlyPlayed.map(n => GAMES.find(g => g.name === n)).filter(Boolean);
  else list = GAMES.filter(g => g.category === gamesFilter);

  list = [...list].sort((a, b) => order === 'za' ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name));
  const letters = buildLetterMap(list);
  let keys = sortedLetterKeys(letters);
  if (order === 'za') keys = keys.reverse();

  document.getElementById('gamesAZ').innerHTML = buildAZBar(letters);
  const countEl = document.getElementById('gamesCount');
  if (countEl) countEl.textContent = list.length;

  wrap.innerHTML = list.length
    ? keys.map(k => letterSectionHTML(k, letters[k])).join('')
    : `<div class="no-results"><div class="big">&#127918;</div><p>No games here yet.</p></div>`;
}

function renderGames(area) {
  const cats = {};
  GAMES.forEach(g => { cats[g.category] = (cats[g.category] || 0) + 1; });
  const catList = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  const countBadge = settings.showCount ? `<span class="badge" id="gamesCount">${GAMES.length}</span>` : '';
  const tag = (f, label) => `<div class="explore-tag ${gamesFilter === f ? 'active' : ''}" onclick="filterExplore(this, '${f.replace(/'/g, "\\'")}')">${label}</div>`;
  area.innerHTML = `
    <div class="section-header">
      <h2>&#127918; Games</h2>${countBadge}
      <div class="sort-toggle">
        <button class="sort-btn" data-order="az" onclick="setGamesOrder('az')">A&rarr;Z</button>
        <button class="sort-btn" data-order="za" onclick="setGamesOrder('za')">Z&rarr;A</button>
      </div>
    </div>
    <div class="explore-tags">
      ${tag('all', `All (${GAMES.length})`)}
      ${tag('popular', '&#128293; Popular')}
      ${tag('favorites', '&#10084;&#65039; Favorites')}
      ${tag('recent', '&#128338; Recent')}
      ${catList.map(([c, n]) => tag(c, `${c} (${n})`)).join('')}
    </div>
    <div class="az-bar" id="gamesAZ"></div>
    <div id="gamesList"></div>
    <div class="footer">PlayVault &mdash; ${GAMES.length} games</div>
  `;
  renderGamesList();
}

function renderSearch(area, query) {
  const q = query.toLowerCase();
  const results = sortedGames.filter(g => g.name.toLowerCase().includes(q));
  if (!results.length) {
    area.innerHTML = `<div class="no-results"><div class="big">&#128533;</div><p>No games found for "${query}"</p></div>`;
    return;
  }
  area.innerHTML = `
    <div class="section-header"><h2>Results for "${query}"</h2><span class="badge">${results.length}</span></div>
    <div class="game-grid">${results.map(g => gameCard(g)).join('')}</div>
  `;
}

  const favGames = favorites.map(n => GAMES.find(g => g.name === n)).filter(Boolean);

}

function formatKey(key) {
  if (key === '`') return '` (Backtick)';
  if (key === 'Escape') return 'Esc';
  return key;
}

let capturingKey = false;
function startKeyCapture(el) {
  capturingKey = true;
  el.classList.add('listening');
  el.textContent = 'Press a key...';
  const handler = (e) => {
    e.preventDefault();
    e.stopPropagation();
    settings.panicKey = e.key;
    saveSettings();
    el.textContent = formatKey(e.key);
    el.classList.remove('listening');
    capturingKey = false;
    document.removeEventListener('keydown', handler, true);
  };
  document.addEventListener('keydown', handler, true);
}

function getCleanAppUrl() {

function getLaunchPageUrl() {
  try {

  } catch(e) {
    return window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/launch.html');
  }
}

}

      if (Array.isArray(data.favorites)) favorites = data.favorites;
      if (Array.isArray(data.recentlyPlayed)) recentlyPlayed = data.recentlyPlayed;

function buildLetterMap(games) {
  const letters = {};
  games.forEach(g => {

    letters[l].push(g);
  });
  return letters;
}

function sortedLetterKeys(letters) {
  return Object.keys(letters).sort((a,b) => {
    if (a === '#') return -1; if (b === '#') return 1; return a.localeCompare(b);
  });
}

// ---- Game launch animation (compositor-only: transform + opacity) ----
let lastLaunchRect = null;
let launchId = 0;
let closingGame = false;
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[onclick*="openGame"]');
  if (el) lastLaunchRect = el.getBoundingClientRect();
}, true);

const LAUNCH_EASE_OUT = 'cubic-bezier(.22,1,.36,1)';
const LAUNCH_EASE_IN = 'cubic-bezier(.4,0,1,1)';

// Compute a smooth 3D translation from the clicked card toward the center.
function launchOffsetTransform(scale) {
  const r = lastLaunchRect;
  if (!r || r.width < 8 || r.height < 8 || r.bottom < 0 || r.top > innerHeight) {
    return `translate3d(0,18px,0) scale(${scale})`;
  }
  const dx = ((r.left + r.width / 2) - innerWidth / 2) * 0.28;
  const dy = ((r.top + r.height / 2) - innerHeight / 2) * 0.28;
  return `translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0) scale(${scale})`;
}

function openGame(name) {
  const game = GAMES.find(g => g.name === name);
  if (!game) return;
  const myId = ++launchId;
  closingGame = false;
  recentlyPlayed = recentlyPlayed.filter(n => n !== name);
  recentlyPlayed.unshift(name);
  if (recentlyPlayed.length > 20) recentlyPlayed = recentlyPlayed.slice(0, 20);
  try { localStorage.setItem('pv_recent', JSON.stringify(recentlyPlayed)); } catch(e) {}
  document.getElementById('modalIcon').src = game.icon || '';
  document.getElementById('modalTitle').textContent = game.name;
  const favBtn = document.getElementById('modalFav');
  const favTxt = document.getElementById('modalFavText');
  if (favBtn) favBtn.classList.toggle('active', isFavorite(game.name));
  if (favTxt) favTxt.textContent = isFavorite(game.name) ? 'Favorited' : 'Favorite';

  // Splash screen
  const splash = document.getElementById('gameSplash');
  const splashIcon = document.getElementById('splashIcon');
  splashIcon.src = game.icon || '';
  splashIcon.style.visibility = game.icon ? '' : 'hidden';
  document.getElementById('splashTitle').textContent = game.name;
  document.getElementById('splashSub').textContent = game.cat ? `${game.cat} · Loading` : 'Loading';
  splash.getAnimations().forEach(a => a.cancel());
  splash.classList.remove('hidden');

  const frame = document.getElementById('gameFrame');
  frame.style.opacity = '0';

  const overlay = document.getElementById('gameModal');
  const modal = overlay.querySelector('.modal');
  overlay.getAnimations().forEach(a => a.cancel());
  modal.getAnimations().forEach(a => a.cancel());
  overlay.classList.add('active');
  document.body.classList.add('modal-open');
  document.body.style.overflow = 'hidden';

  const reduced = settings.reducedMotion;
  const openedAt = performance.now();

  const revealGame = () => {
    if (myId !== launchId || closingGame) return;
    const wait = Math.max(0, (reduced ? 0 : 480) - (performance.now() - openedAt));
    setTimeout(() => {
      if (myId !== launchId || closingGame) return;
      const curFrame = document.getElementById('gameFrame');
      if (curFrame) curFrame.style.opacity = '1';
      if (reduced) { splash.classList.add('hidden'); return; }
      splash.animate(
        [{ opacity: 1, transform: 'translate3d(0,0,0) scale(1)' },
         { opacity: 0, transform: 'translate3d(0,0,0) scale(1.03)' }],
        { duration: 220, easing: 'ease-out' }
      ).onfinish = () => { if (myId === launchId) splash.classList.add('hidden'); };
    }, wait);
  };

  const startFrameLoad = () => {
    if (myId !== launchId || closingGame) return;
    const curFrame = document.getElementById('gameFrame');
    curFrame.onload = () => { if (curFrame.getAttribute('src') === game.file) revealGame(); };
    curFrame.src = game.file;
  };

  if (!reduced) {
    overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
    const openAnim = modal.animate(
      [{ opacity: 0, transform: launchOffsetTransform(0.88) },
       { opacity: 1, transform: 'translate3d(0,0,0) scale(1)' }],
      { duration: 280, easing: LAUNCH_EASE_OUT });
    // Defer heavy iframe loading until the entrance animation finishes so it never drops frames
    openAnim.onfinish = startFrameLoad;
  } else {
    requestAnimationFrame(startFrameLoad);
  }
  setTimeout(revealGame, 12000); // safety net if load never fires
}

function destroyGameFrame() {
  const old = document.getElementById('gameFrame');
  if (!old || !old.parentNode) return;
  const fresh = old.cloneNode(false);
  fresh.removeAttribute('src');
  fresh.style.opacity = '0';
  old.parentNode.replaceChild(fresh, old);
}

function closeGame() {
  const overlay = document.getElementById('gameModal');
  if (!overlay.classList.contains('active') || closingGame) return;
  closingGame = true;
  const myId = launchId;

  const modal = overlay.querySelector('.modal');
  const frame = document.getElementById('gameFrame');
  if (frame) frame.style.opacity = '0';

  const finish = () => {
    if (myId !== launchId) return;
    destroyGameFrame();
    overlay.classList.remove('active');
    overlay.getAnimations().forEach(a => a.cancel());
    modal.getAnimations().forEach(a => a.cancel());
    document.body.classList.remove('modal-open');
    document.body.style.overflow = '';
    closingGame = false;
    if (currentView === 'home') renderView('home');
  };

  if (settings.reducedMotion) { finish(); return; }

  overlay.getAnimations().forEach(a => a.cancel());
  modal.getAnimations().forEach(a => a.cancel());
  overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 190, easing: 'ease-in', fill: 'forwards' });
  modal.animate(
    [{ opacity: 1, transform: 'translate3d(0,0,0) scale(1)' },
     { opacity: 0, transform: launchOffsetTransform(0.9) }],
    { duration: 200, easing: LAUNCH_EASE_IN, fill: 'forwards' }
  ).onfinish = finish;
}

function setupEvents() {
  const searchWrap = document.getElementById('searchWrap');
  const searchInput = document.getElementById('searchInput');
  document.getElementById('searchToggle').addEventListener('click', () => {
    searchWrap.classList.toggle('expanded');
    if (searchWrap.classList.contains('expanded')) searchInput.focus();
    else { searchInput.value = ''; if (currentView === 'search') renderView('home'); }
  });

  let searchTimeout;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      const q = searchInput.value.trim();
      if (q.length >= 2) renderView('search', q);
      else if (q.length === 0 && currentView === 'search') renderView('home');
    }, 200);
  });

  document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      renderView(btn.dataset.view);
      searchWrap.classList.remove('expanded');
      searchInput.value = '';
    });
  });

  document.getElementById('modalClose').addEventListener('click', closeGame);
  document.getElementById('gameModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeGame();
  });

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    const modal = document.querySelector('.modal');
    if (document.fullscreenElement) document.exitFullscreen();
    else modal.requestFullscreen().catch(() => {});
  });

  document.addEventListener('keydown', e => {
    if (capturingKey) return;
    const tag = (e.target && e.target.tagName) || '';
    const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    // Panic key
    if (e.key === settings.panicKey && (!inInput || e.key === '`' || e.key === 'Escape')) {
      window.location.replace(settings.panicUrl || 'https://classroom.google.com');
      return;
    }

    if (e.key === 'Escape') {
      if (document.getElementById('fakeUpdateOverlay').classList.contains('active')) { closeFakeUpdate(); return; }
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      if (document.getElementById('setupOverlay').classList.contains('active')) { closeSetupWizard(); return; }
      if (document.getElementById('gameModal').classList.contains('active')) closeGame();
      else if (searchWrap.classList.contains('expanded')) {
        searchWrap.classList.remove('expanded');
        searchInput.value = '';
        if (currentView === 'search') renderView('home');
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      searchWrap.classList.add('expanded');
      searchInput.focus();
    }
  });

  window.addEventListener('blur', () => {
    if (settings.autoCloakBlur && settings.cloak === 'none') {
      const gdocs = CLOAK_PRESETS.find(p => p.id === 'gdocs');
      if (gdocs) {
        document.title = gdocs.title;
        document.getElementById('cloakFavicon').href = gdocs.favicon;
      }
    }
  });
  window.addEventListener('focus', () => {
    if (settings.autoCloakBlur) applyCloak();
  });
}

// ===== REPORTS =====
function getReports() {
  try { return JSON.parse(localStorage.getItem('pv_reports') || '[]'); } catch(e) { return []; }
}

function saveReports(reports) {
  try { localStorage.setItem('pv_reports', JSON.stringify(reports)); } catch(e) {}
}

function showReportForm() {
  const name = document.getElementById('modalTitle').textContent;
  document.getElementById('reportGameName').textContent = name;
  document.getElementById('reportComment').value = '';
  document.querySelectorAll('input[name="reportReason"]')[0].checked = true;
  document.getElementById('reportOverlay').classList.add('active');
}

function hideReportForm() {
  document.getElementById('reportOverlay').classList.remove('active');
}

function submitReport() {
  const name = document.getElementById('reportGameName').textContent;
  const reason = document.querySelector('input[name="reportReason"]:checked').value;
  const comment = document.getElementById('reportComment').value.trim();
  const reports = getReports();
  reports.unshift({
    id: Date.now(),
    game: name,
    reason: reason,
    comment: comment,
    time: new Date().toISOString(),
    read: false
  });
  saveReports(reports);
  const box = document.querySelector('.report-box');
  box.innerHTML = '<div class="report-success">&#9989; Report submitted! Thanks for helping improve PlayVault.</div>';
  setTimeout(hideReportForm, 1500);
}

const REASON_LABELS = {not_working:'Not Working', broken:'Broken', offensive:'Offensive', other:'Other'};

function renderReportsInbox() {
  const reports = getReports();
  if (!reports.length) return '<div class="inbox-empty">&#128235; No reports yet. Users can report games from the game player.</div>';
  return reports.map((r, i) => `
    <div class="inbox-item">
      <span class="inbox-badge ${r.reason}">${REASON_LABELS[r.reason] || r.reason}</span>
      <div class="inbox-info">
        <div class="inbox-name">${r.game}</div>
        ${r.comment ? `<div class="inbox-comment">${r.comment.replace(/</g,'&lt;')}</div>` : ''}
        <div class="inbox-time">${new Date(r.time).toLocaleString()}</div>
      </div>
      <div class="inbox-actions">
        <button onclick="openGame('${r.game.replace(/'/g, "\\'")}');hideReportForm()">Play</button>
        <button class="del" onclick="dismissReport(${r.id})">Dismiss</button>
      </div>
    </div>
  `).join('');
}

function dismissReport(id) {
  const reports = getReports().filter(r => r.id !== id);
  saveReports(reports);
  renderSettings(document.getElementById('contentArea'));
}

function clearAllReports() {
  saveReports([]);
  renderSettings(document.getElementById('contentArea'));
}

function loadRomFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const sel = document.getElementById('emuCoreSelect')?.value || 'auto';
  const core = sel === 'auto' ? (EMU_EXT_MAP[ext] || 'gba') : sel;
  const blobUrl = URL.createObjectURL(file);
  const stage = document.getElementById('emuStage');
  const frame = document.getElementById('emuFrame');
  if (!stage || !frame) return;
  stage.classList.add('active');

  let html;
  if (core === 'swf') {

    </p>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="text" id="saveSearchInput" placeholder="Filter save keys..." oninput="refreshSaveList()" style="flex:1;min-width:200px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none">

      <button class="s-btn" style="padding:11px 18px" onclick="document.getElementById('importAllSavesInput').click()">&#11014; Import Saves (.json)</button>
      <input type="file" id="importAllSavesInput" accept=".json" style="display:none" onchange="importAllLocalStorage(event)">
    </div>
    <div class="save-list" id="saveList"></div>`;
}

function refreshSaveList() {
  const listEl = document.getElementById('saveList');
  const statsEl = document.getElementById('saveStats');
  if (!listEl || !statsEl) return;
  const q = (document.getElementById('saveSearchInput')?.value || '').toLowerCase();
  const keys = [];
  let totalBytes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || '';
      const bytes = (k.length + v.length) * 2;
      totalBytes += bytes;
      keys.push({ key: k, val: v, bytes });
    }
  } catch(e) {}
  keys.sort((a, b) => b.bytes - a.bytes);
  const gameKeys = keys.filter(x => !x.key.startsWith('pv_')).length;

  statsEl.innerHTML = `
    <div class="save-stat-box"><div class="ss-val">${keys.length}</div><div class="ss-lbl">Total Storage Keys</div></div>
    <div class="save-stat-box"><div class="ss-val">${gameKeys}</div><div class="ss-lbl">Game Save Entries</div></div>
    <div class="save-stat-box"><div class="ss-val">${(totalBytes / 1024).toFixed(1)} KB</div><div class="ss-lbl">Total Save Size</div></div>
  `;

  const filtered = keys.filter(x => x.key.toLowerCase().includes(q));
  if (!filtered.length) {
    listEl.innerHTML = `<div class="inbox-empty">No save keys matching "${q}".</div>`;
    return;
  }
  listEl.innerHTML = filtered.map((item, idx) => {
    const preview = item.val.slice(0, 90).replace(/</g, '&lt;');
    const isPV = item.key.startsWith('pv_');
    return `
      <div class="save-item">
        <div style="min-width:0;flex:1">
          <div class="si-key">${item.key.replace(/</g,'&lt;')} ${isPV ? '<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(124,108,240,.2);color:var(--accent2);margin-left:6px">PlayVault</span>' : '<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(0,206,201,.18);color:#00cec9;margin-left:6px">Game Save</span>'}</div>
          <div class="si-meta">${(item.bytes / 1024).toFixed(2)} KB &bull; ${preview}</div>
        </div>
        <div class="si-actions">
          <button class="s-btn" onclick="editSaveKey(${idx})">Edit</button>
          <button class="s-btn danger" onclick="deleteSaveKey(${idx})">Delete</button>
        </div>
      </div>`;
  }).join('');
  window._currentSaveKeys = filtered;
}

function editSaveKey(idx) {
  const item = window._currentSaveKeys && window._currentSaveKeys[idx];
  if (!item) return;
  const next = prompt(`Edit value for "${item.key}":`, item.val);
  if (next !== null) {
    try { localStorage.setItem(item.key, next); } catch(e) {}
    loadSettings();
    refreshSaveList();
  }
}

function deleteSaveKey(idx) {
  const item = window._currentSaveKeys && window._currentSaveKeys[idx];
  if (!item) return;
  try { localStorage.removeItem(item.key); } catch(e) {}
  refreshSaveList();
}

function exportAllLocalStorage() {
  const dump = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      dump[k] = localStorage.getItem(k);
    }
  } catch(e) {}
  const blob = new Blob([JSON.stringify({ playvaultSaveBackup: 1, timestamp: new Date().toISOString(), data: dump }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `playvault-all-saves-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importAllLocalStorage(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const data = parsed.data || parsed;
      Object.entries(data).forEach(([k, v]) => {
        if (typeof v === 'string') localStorage.setItem(k, v);
      });
      loadSettings();
      try { favorites = JSON.parse(localStorage.getItem('pv_favorites') || '[]'); } catch(err) {}
      try { recentlyPlayed = JSON.parse(localStorage.getItem('pv_recent') || '[]'); } catch(err) {}
      refreshSaveList();
    } catch(err) {
      alert('Invalid save backup JSON file.');
    }
  };
  reader.readAsText(file);
}

function normalizeLaunchUrl(raw) {
  let u = (raw || '').trim();
  if (!u) return '';
  if (!/^[a-zA-Z]+:\/\//.test(u)) u = 'https://' + u;
  return u;
}

function launchEmbedMode(mode) {
  const url = normalizeLaunchUrl(document.getElementById('embedUrlInput')?.value);
  if (!url) return;
  const customTitle = (document.getElementById('embedTitleInput')?.value || '').trim() || document.title;
  const fav = document.getElementById('cloakFavicon')?.href || '';
  const pageHTML = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${customTitle.replace(/</g,'&lt;')}</title><link rel="icon" href="${fav}"><style>*{margin:0;padding:0}html,body,iframe{width:100%;height:100%;border:none;overflow:hidden;background:#000}</style></head><body><iframe src="${url.replace(/"/g,'&quot;')}" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe></body></html>`;

  if (mode === 'modal') {
    document.getElementById('modalIcon').src = ORIGINAL_FAVICON;
    document.getElementById('modalTitle').textContent = customTitle;
    document.getElementById('gameSplash').classList.add('hidden');
    const frame = document.getElementById('gameFrame');
    frame.style.opacity = '1';
    frame.src = url;
    document.getElementById('gameModal').classList.add('active');
    document.body.classList.add('modal-open');
    document.body.style.overflow = 'hidden';
  } else if (mode === 'blank') {
    const win = window.open('about:blank', '_blank');
    if (win) { win.document.write(pageHTML); win.document.close(); }
  } else if (mode === 'blob') {
    const blob = new Blob([pageHTML], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  }
}

function stopAllSounds() {
  activeSbAudios.forEach(a => {
    try { a.pause(); a.currentTime = 0; } catch(e) {}
  });
  activeSbAudios = [];
  document.querySelectorAll('.sb-pad.playing').forEach(b => b.classList.remove('playing'));
}

function addCustomSoundPad(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  customSounds.push({ name: file.name.replace(/\.[^.]+$/, '').slice(0, 18), url: URL.createObjectURL(file) });
  if (currentView === 'tools' && currentTool === 'soundboard') renderTools(document.getElementById('contentArea'));
}

function triggerSoundPad(src, btn) {
  const audio = new Audio(src);
  audio.volume = sbVolume;
  audio.playbackRate = sbPitch;
  audio.preservesPitch = false;
  activeSbAudios.push(audio);
  if (btn) btn.classList.add('playing');
  const cleanup = () => {
    activeSbAudios = activeSbAudios.filter(x => x !== audio);
    if (btn) btn.classList.remove('playing');
  };
  audio.onended = cleanup;
  audio.onerror = cleanup;
  audio.play().catch(cleanup);
}

async function downloadOfflineGame(name, btn) {
  const game = GAMES.find(g => g.name === name);
  if (!game) return;
  const origText = btn ? btn.innerHTML : '';
  if (btn) btn.textContent = '...';
  try {
    const resp = await fetch(game.file);
    let html = await resp.text();
    const baseHref = new URL(game.file, window.location.href).href.replace(/[^/]+$/, '');
    if (!/<base\s/i.test(html)) {
      html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${baseHref}">`);
    }
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = game.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.html';
    a.click();
    URL.revokeObjectURL(a.href);
    if (btn) { btn.textContent = 'Saved!'; setTimeout(() => { btn.innerHTML = origText; }, 1200); }
  } catch(e) {
    if (btn) btn.innerHTML = origText;
  }
}

// ---- 8. Cloud Game Vault (2,200+ Extra Games) ----
let cloudVaultGames = [];
let cloudVaultLoading = false;

function formatCloudName(raw) {
  let s = raw.replace(/^cl/i, '').replace(/\.html$/i, '');
  s = s.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([a-zA-Z])(\d)/g, '$1 $2').replace(/[-_]+/g, ' ');
  return s.replace(/\b\w/g, c => c.toUpperCase()).trim() || raw;
}

function renderCloudVault() {
  return `
    <p style="color:var(--text2);font-size:15px;margin-bottom:14px">
      Stream or download over <strong>2,200+ extra single-file games</strong> on demand from the Ultimate Game Stash cloud repository. Play directly inside PlayVault, launch in <code style="background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px">about:blank</code>, or save offline.
    </p>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <input type="text" id="cvSearchInput" placeholder="Search 2,200+ cloud games (e.g. fnaf, pokemon, sonic, mario, fnf, papaspizzeria)..." oninput="filterCloudVault()" style="flex:1;min-width:240px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-size:15px;outline:none">
      <button class="s-btn" onclick="randomCloudGame()">&#127922; Random Cloud Game</button>
    </div>
    <div id="cvStatus" style="font-size:13px;color:var(--text3);margin-bottom:10px">Loading cloud catalog...</div>
    <div class="dl-grid" id="cvGrid" style="max-height:540px"></div>`;
}

async function initCloudVault() {
  const statusEl = document.getElementById('cvStatus');
  if (cloudVaultGames.length) {
    filterCloudVault();
    return;
  }
  if (cloudVaultLoading) return;
  cloudVaultLoading = true;
  try {
    const resp = await fetch('https://raw.githubusercontent.com/genizy/ugs-singlefile/main/games.js');
    const txt = await resp.text();
    const matches = txt.match(/'cl[^']+'/g) || [];
    cloudVaultGames = matches.map(m => {
      const id = m.slice(1, -1);
      return { id, title: formatCloudName(id) };
    });
  } catch (e) {
    if (statusEl) statusEl.textContent = 'Could not reach Cloud Game Vault (check internet connection).';
  }
  cloudVaultLoading = false;
  filterCloudVault();
}

function filterCloudVault() {
  const grid = document.getElementById('cvGrid');
  const statusEl = document.getElementById('cvStatus');
  if (!grid) return;
  const q = (document.getElementById('cvSearchInput')?.value || '').toLowerCase().trim();
  const filtered = q
    ? cloudVaultGames.filter(g => g.title.toLowerCase().includes(q) || g.id.toLowerCase().includes(q))
    : cloudVaultGames;
  if (statusEl) {
    statusEl.textContent = `Showing ${Math.min(100, filtered.length)} of ${filtered.length} matching cloud games (${cloudVaultGames.length} total in Cloud Stash)`;
  }
  grid.innerHTML = filtered.slice(0, 100).map(g => {
    const escId = g.id.replace(/'/g, "\\'");
    const escTitle = g.title.replace(/'/g, "\\'");
    return `
      <div class="dl-card" style="justify-content:space-between">
        <div class="dl-info">
          <div class="dl-name" title="${g.title}">${g.title}</div>
          <div class="dl-cat">${g.id}.html</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="s-btn primary" style="padding:7px 12px;font-size:12px" onclick="launchCloudGame('${escId}','${escTitle}','modal',this)">&#9654; Play</button>
          <button class="s-btn" style="padding:7px 10px;font-size:12px" title="Open in about:blank" onclick="launchCloudGame('${escId}','${escTitle}','blank',this)">&#128373;</button>
          <button class="s-btn" style="padding:7px 10px;font-size:12px" title="Download .HTML" onclick="launchCloudGame('${escId}','${escTitle}','download',this)">&#11015;</button>
        </div>
      </div>`;
  }).join('');
}

function fixCloudGenizyUrls(html) {
  return html
    .replace(/https:\/\/cdn\.jsdelivr\.net\/gh\/genizy\/([^/@"'\s]+)@main\//g, 'https://raw.githack.com/genizy/$1/main/')
    .replace(/https:\/\/cdn\.jsdelivr\.net\/gh\/genizy\/([^/@"'\s]+)@([^/"'\s]+)\//g, 'https://rawcdn.githack.com/genizy/$1/$2/')
    .replace(/https:\/\/cdn\.jsdelivr\.net\/gh\/genizy\/([^/@"'\s]+)\//g, 'https://raw.githack.com/genizy/$1/main/');
}

async function launchCloudGame(id, title, mode, btn) {
  const orig = btn ? btn.innerHTML : '';
  if (btn) btn.textContent = '...';
  try {
    const url = `https://raw.githubusercontent.com/genizy/ugs-singlefile/main/UGS-Files/${encodeURIComponent(id)}.html`;
    const r = await fetch(url);
    let html = await r.text();
    html = fixCloudGenizyUrls(html);
    if (mode === 'download') {
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = id + '.html';
      a.click();
      URL.revokeObjectURL(a.href);
    } else if (mode === 'blank') {
      const win = window.open('about:blank', '_blank');
      if (win) { win.document.write(html); win.document.close(); }
    } else {
      const blob = new Blob([html], { type: 'text/html' });
      const blobUrl = URL.createObjectURL(blob);
      document.getElementById('modalIcon').src = ORIGINAL_FAVICON;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('gameSplash').classList.add('hidden');
      const frame = document.getElementById('gameFrame');
      frame.style.opacity = '1';
      frame.src = blobUrl;
      document.getElementById('gameModal').classList.add('active');
      document.body.classList.add('modal-open');
      document.body.style.overflow = 'hidden';
    }
  } catch (e) {
    alert('Failed to load cloud game: ' + id);
  }
  if (btn) btn.innerHTML = orig;
}

function randomCloudGame() {
  if (!cloudVaultGames.length) return;
  const g = cloudVaultGames[Math.floor(Math.random() * cloudVaultGames.length)];
  launchCloudGame(g.id, g.title, 'modal', null);
}

let gpRaf = null;

let cpsBest = 0;
let activeKeysSet = new Set();

function renderGamepadTester() {

            <div style="font-size:11px;color:var(--text3)">Best CPS</div>
          </div>
        </div>
        <div id="cpsPad" onmousedown="registerCpsClick(event)" style="height:150px;border-radius:14px;background:linear-gradient(135deg,rgba(124,108,240,.18),rgba(0,206,201,.12));border:2px dashed var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .06s">
          <div style="font-size:18px;font-weight:800" id="cpsPadTitle">CLICK HERE TO START (${cpsDuration}s)</div>

        </div>
      </div>

      <!-- Gamepad Tester -->
      <div style="background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:16px;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h4 style="font-size:16px;font-weight:700">&#127918; Gamepad &amp; Stick Radar</h4>
          <button class="s-btn" onclick="testGamepadRumble()">&#128243; Test Rumble</button>

        <div id="gpNameStatus" style="font-size:13px;color:var(--text2);margin-bottom:12px">Connect a controller and press any button...</div>

        <span style="font-size:12px;color:var(--text2)" id="kbSimulCount">0 keys held simultaneously</span>
