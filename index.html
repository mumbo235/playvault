function setCpsMode(sec) {
  cpsDuration = sec;
  cpsRunning = false;
  clearInterval(cpsTimerId);
  cpsClicks = 0;
  const tl = document.getElementById('cpsTimeLeft');
  const pt = document.getElementById('cpsPadTitle');
  const cv = document.getElementById('cpsCountVal');
  const lv = document.getElementById('cpsLiveVal');
  if (tl) tl.textContent = sec.toFixed(1);
  if (pt) pt.textContent = `CLICK HERE TO START (${sec}s)`;
  if (cv) cv.textContent = '0';
  if (lv) lv.textContent = '0.0';
}

function registerCpsClick(e) {
  const pad = document.getElementById('cpsPad');
  if (pad) {
    pad.style.transform = 'scale(0.97)';
    setTimeout(() => { if (pad) pad.style.transform = 'scale(1)'; }, 55);
  }
  const now = performance.now();
  if (!cpsRunning) {
    if (cpsStartTime && now - cpsStartTime < 900) return; // brief cooldown after finish
    cpsRunning = true;
    cpsClicks = 0;
    cpsStartTime = now;
    cpsTimerId = setInterval(() => {
      const elapsed = (performance.now() - cpsStartTime) / 1000;
      const rem = Math.max(0, cpsDuration - elapsed);
      const tl = document.getElementById('cpsTimeLeft');
      const lv = document.getElementById('cpsLiveVal');
      if (tl) tl.textContent = rem.toFixed(1);
      const curCps = cpsClicks / Math.max(0.1, elapsed);
      if (lv) lv.textContent = curCps.toFixed(1);
      if (rem <= 0) {
        clearInterval(cpsTimerId);
        cpsRunning = false;
        cpsStartTime = performance.now();
        const finalCps = cpsClicks / cpsDuration;
        if (finalCps > cpsBest) cpsBest = finalCps;
        const bv = document.getElementById('cpsBestVal');
        const pt = document.getElementById('cpsPadTitle');
        if (bv) bv.textContent = cpsBest.toFixed(1);
        if (pt) pt.textContent = `SCORE: ${finalCps.toFixed(1)} CPS (${cpsClicks} clicks) — Click to Retry`;
      }
    }, 50);
  }
  cpsClicks++;
  const cv = document.getElementById('cpsCountVal');
  if (cv) cv.textContent = cpsClicks;
}

function initGamepadTester() {
  stopGamepadPoll();
  activeKeysSet.clear();
  const poll = () => {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads[0] || pads[1] || pads[2] || pads[3];
    const status = document.getElementById('gpNameStatus');
    if (gp && status) {
      status.textContent = `Connected: ${gp.id}`;
      status.style.color = '#00e676';
      gp.buttons.slice(0, 16).forEach((b, i) => {
        const el = document.getElementById('gpBtn' + i);
        if (el) {
          el.style.background = b.pressed ? 'var(--accent)' : 'rgba(255,255,255,.04)';
          el.style.color = b.pressed ? '#fff' : 'var(--text)';
        }
      });
      drawStickRadar('gpStickL', gp.axes[0] || 0, gp.axes[1] || 0, 'L');
      drawStickRadar('gpStickR', gp.axes[2] || 0, gp.axes[3] || 0, 'R');
    } else {
      drawStickRadar('gpStickL', 0, 0, 'L');
      drawStickRadar('gpStickR', 0, 0, 'R');
    }
    gpRaf = requestAnimationFrame(poll);
  };
  gpRaf = requestAnimationFrame(poll);
}

function drawStickRadar(canvasId, x, y, label) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 100, 100);
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath();
  ctx.moveTo(50, 0); ctx.lineTo(50, 100);
  ctx.moveTo(0, 50); ctx.lineTo(100, 50);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.font = '10px sans-serif';
  ctx.fillText(label, 8, 16);
  ctx.fillStyle = '#00e676';
  ctx.beginPath();
  ctx.arc(50 + x * 40, 50 + y * 40, 6, 0, Math.PI * 2);
  ctx.fill();
}

function testGamepadRumble() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = pads[0] || pads[1] || pads[2] || pads[3];
  if (gp && gp.vibrationActuator) {
    gp.vibrationActuator.playEffect('dual-rumble', { duration: 400, strongMagnitude: 1.0, weakMagnitude: 0.7 });
  }
}

function stopGamepadPoll() {
  if (gpRaf) { cancelAnimationFrame(gpRaf); gpRaf = null; }
  if (cpsTimerId) { clearInterval(cpsTimerId); cpsTimerId = null; }
  cpsRunning = false;
}

window.addEventListener('keydown', e => {
  if (currentView !== 'tools' || currentTool !== 'gamepad') return;
  activeKeysSet.add(`${e.code} (${e.key === ' ' ? 'Space' : e.key})`);
  updateKbTesterUI();
});

let paintTool = 'brush';
let paintColor = '#7c6cf0';
let paintSize = 8;
let paintGrid = false;
let paintHistory = [];

function renderPaintStudio() {
  const palette = ['#ffffff','#ff6b6b','#ff9f43','#feca57','#1dd1a1','#00d2d3','#54a0ff','#7c6cf0','#f368e0','#222f3e','#000000'];

function setPaintTool(t) {
  paintTool = t;
  ['brush','pixel','line','rect','eraser'].forEach(id => {
    const el = document.getElementById('pt_' + id);
    if (el) el.classList.toggle('primary', id === t);
  });
}

function initPaintStudio() {
  const c = document.getElementById('paintCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0e0e1a';
  ctx.fillRect(0, 0, c.width, c.height);
  paintHistory = [ctx.getImageData(0, 0, c.width, c.height)];

  let drawing = false;
  let startX = 0, startY = 0;
  let snapshot = null;

  const pos = (e) => {
    const r = c.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (c.width / r.width),
      y: (e.clientY - r.top) * (c.height / r.height)
    };
  };

  c.onpointerdown = (e) => {
    drawing = true;
    const p = pos(e);
    startX = p.x; startY = p.y;
    snapshot = ctx.getImageData(0, 0, c.width, c.height);
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    if (paintTool === 'pixel') {
      const gx = Math.floor(p.x / 16) * 16;
      const gy = Math.floor(p.y / 16) * 16;
      ctx.fillStyle = paintColor;
      ctx.fillRect(gx, gy, 16, 16);
    }
  };

  c.onpointermove = (e) => {
    if (!drawing) return;
    const p = pos(e);
    if (paintTool === 'brush' || paintTool === 'eraser') {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = paintSize;
      ctx.strokeStyle = paintTool === 'eraser' ? '#0e0e1a' : paintColor;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (paintTool === 'pixel') {
      const gx = Math.floor(p.x / 16) * 16;
      const gy = Math.floor(p.y / 16) * 16;
      ctx.fillStyle = paintColor;
      ctx.fillRect(gx, gy, 16, 16);
    } else if (paintTool === 'line') {
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath();
      ctx.lineWidth = paintSize;
      ctx.strokeStyle = paintColor;
      ctx.moveTo(startX, startY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (paintTool === 'rect') {
      ctx.putImageData(snapshot, 0, 0);
      ctx.lineWidth = Math.max(2, Math.floor(paintSize / 2));
      ctx.strokeStyle = paintColor;
      ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
    }
  };

  window.onpointerup = () => {
    if (!drawing) return;
    drawing = false;
    paintHistory.push(ctx.getImageData(0, 0, c.width, c.height));
    if (paintHistory.length > 25) paintHistory.shift();
  };
}

function undoPaint() {
  const c = document.getElementById('paintCanvas');
  if (!c || paintHistory.length <= 1) return;
  paintHistory.pop();
  c.getContext('2d').putImageData(paintHistory[paintHistory.length - 1], 0, 0);
}

function clearPaintCanvas() {
  const c = document.getElementById('paintCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0e0e1a';
  ctx.fillRect(0, 0, c.width, c.height);
  paintHistory.push(ctx.getImageData(0, 0, c.width, c.height));
}

function exportPaintPng() {
  const c = document.getElementById('paintCanvas');
  if (!c) return;
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'playvault-art.png';
  a.click();
}

let synthAudioCtx = null;

];
let synthGrid = SYNTH_ROWS.map(() => Array(16).fill(false));
let synthTimer = null;
let synthStep = 0;

function renderSynthBeatMaker() {
  const notes = [

function initSynthBeatMaker() {
  if (!synthGrid.some(r => r.some(Boolean))) loadArcadePresetBeat();
}

function toggleSynthCell(r, c) {
  synthGrid[r][c] = !synthGrid[r][c];
  const el = document.getElementById(`scell_${r}_${c}`);
  if (el) el.style.background = synthGrid[r][c] ? SYNTH_ROWS[r].color : (c % 4 === 0 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.02)');
  if (synthGrid[r][c]) triggerSynthRow(SYNTH_ROWS[r]);
}

function triggerSynthRow(row) {
  const ctx = getSbAudioCtx();
  const t = ctx.currentTime;
  if (row.type === 'note' || row.type === 'bass') {
    playSynthTone(row.freq, row.type === 'bass' ? 'sawtooth' : 'square', 0.16);
  } else if (row.type === 'kick') {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(32, t + 0.14);
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.15);
  } else if (row.type === 'snare' || row.type === 'hat') {
    const dur = row.type === 'hat' ? 0.05 : 0.12;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * (dur * 0.5)));
    const src = ctx.createBufferSource(), g = ctx.createGain();
    g.gain.value = row.type === 'hat' ? 0.25 : 0.45;
    src.buffer = buf; src.connect(g); g.connect(ctx.destination);
    src.start(t);
  }
}

function playSynthTone(freq, wave, dur) {
  const ctx = getSbAudioCtx();
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = wave || 'square';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.18));
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + (dur || 0.18));
}

function toggleSynthLoop() {
  if (synthTimer) { stopSynthLoop(); return; }
  const btn = document.getElementById('synthPlayBtn');
  if (btn) btn.innerHTML = '&#9209; Stop Loop';
  const stepMs = (60 / synthBpm / 4) * 1000;
  synthTimer = setInterval(() => {
    for (let r = 0; r < SYNTH_ROWS.length; r++) {
      const prev = (synthStep + 15) % 16;
      const prevEl = document.getElementById(`scell_${r}_${prev}`);
      const curEl = document.getElementById(`scell_${r}_${synthStep}`);
      if (prevEl) prevEl.style.transform = 'scale(1)';
      if (curEl) curEl.style.transform = 'scale(1.12)';
      if (synthGrid[r][synthStep]) triggerSynthRow(SYNTH_ROWS[r]);
    }
    synthStep = (synthStep + 1) % 16;
  }, stepMs);
}

function stopSynthLoop() {
  if (synthTimer) { clearInterval(synthTimer); synthTimer = null; }
  const btn = document.getElementById('synthPlayBtn');
  if (btn) btn.innerHTML = '&#9654; Play Loop';
}

function loadArcadePresetBeat() {
  synthGrid = SYNTH_ROWS.map(() => Array(16).fill(false));
  [0, 4, 8, 12].forEach(c => synthGrid[7][c] = true); // Kick
  [4, 12].forEach(c => synthGrid[6][c] = true);       // Snare
  [2, 6, 10, 14, 15].forEach(c => synthGrid[5][c] = true); // Hat
  [0, 2, 8, 10].forEach(c => synthGrid[4][c] = true); // Bass
  [0, 6, 12].forEach(c => synthGrid[0][c] = true);    // Lead C5
  [3, 9].forEach(c => synthGrid[2][c] = true);        // Lead G4
  [14].forEach(c => synthGrid[1][c] = true);          // Lead A4
  SYNTH_ROWS.forEach((row, r) => {
    for (let c = 0; c < 16; c++) {
      const el = document.getElementById(`scell_${r}_${c}`);
      if (el) el.style.background = synthGrid[r][c] ? row.color : (c % 4 === 0 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.02)');
    }
  });
}

function clearSynthGrid() {
  stopSynthLoop();
  synthGrid = SYNTH_ROWS.map(() => Array(16).fill(false));
  SYNTH_ROWS.forEach((row, r) => {
    for (let c = 0; c < 16; c++) {
      const el = document.getElementById(`scell_${r}_${c}`);
      if (el) el.style.background = c % 4 === 0 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.02)';
    }
  });
}

  const el = document.getElementById('notesWordCount');
  if (el) el.textContent = `${words} words · ${val.length} chars`;

function downloadStealthNotes() {
  const val = document.getElementById('stealthNotesArea')?.value || '';

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'notes.txt';
  a.click();
  URL.revokeObjectURL(a.href);

function evalMathExpr(expr, xVal) {
  const clean = expr
    .replace(/\^/g, '**')
    .replace(/\b(sin|cos|tan|sqrt|abs|log|exp|floor|ceil|round)\b/g, 'Math.$1')
    .replace(/\bpi\b/gi, 'Math.PI')
    .replace(/\bx\b/g, `(${xVal})`);
  return Function('"use strict"; return (' + clean + ')')();
}

function evalOrGraphCalc() {
  const expr = (document.getElementById('calcExprInput')?.value || '').trim();
  const out = document.getElementById('calcResultOut');
  const c = document.getElementById('calcGraphCanvas');
  if (!expr || !c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);

  // Draw axes
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, c.height / 2); ctx.lineTo(c.width, c.height / 2);
  ctx.moveTo(c.width / 2, 0); ctx.lineTo(c.width / 2, c.height);
  ctx.stroke();

  try {
    if (!/\bx\b/.test(expr)) {
      const val = evalMathExpr(expr, 0);
      if (out) out.textContent = `= ${val}`;
    } else {
      const y0 = evalMathExpr(expr, 0);
      if (out) out.textContent = `f(x) = ${expr}   |   f(0) = ${Number(y0).toFixed(3)}`;
    }
    ctx.strokeStyle = '#00cec9';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    let started = false;
    for (let px = 0; px < c.width; px++) {
      const x = (px - c.width / 2) / 20;
      const y = evalMathExpr(expr, x);
      if (Number.isFinite(y)) {
        const py = c.height / 2 - y * 20;
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      } else {
        started = false;
      }
    }
    ctx.stroke();
  } catch (e) {
    if (out) out.textContent = 'Invalid expression syntax';
  }
}

init();
</script>
</body>
